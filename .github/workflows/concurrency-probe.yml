name: Concurrency Probe

on:
  push:
    branches: ["claude/issue-106-**"]

jobs:
  measure:
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - name: Build and count diagnostics
        run: |
          swift build --build-tests 2>&1 | tee build.log || true
          sed 's#.*/tui-swift/##' build.log > tidy.log
          echo "===== エラーの箇所（重複除去）をターゲット別に数える ====="
          grep -o "^\(Sources\|Tests\)/[^:]*:[0-9]*:[0-9]*: error" tidy.log | sort -u \
            | cut -d/ -f1-2 | sort | uniq -c | sort -rn
          echo "===== エラーのファイル別（重複除去） ====="
          grep -o "^\(Sources\|Tests\)/[^:]*:[0-9]*:[0-9]*: error" tidy.log | sort -u \
            | cut -d: -f1 | sort | uniq -c | sort -rn | head -30
          echo "===== エラーの内訳 ====="
          grep -o "error: .*" tidy.log | sed 's/[0-9]\{1,\}/N/g' | sort | uniq -c | sort -rn | head -25
          echo "===== 合計 ====="
          echo "重複除去した箇所: $(grep -o "^\(Sources\|Tests\)/[^:]*:[0-9]*:[0-9]*: error" tidy.log | sort -u | wc -l)"
          echo "error 行: $(grep -c 'error:' tidy.log || true)"
          echo "warning 行: $(grep -c 'warning:' tidy.log || true)"

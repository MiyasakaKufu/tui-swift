name: Concurrency Probe

on:
  push:
    branches: ["claude/issue-106-**"]

jobs:
  measure:
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - name: POSIX の非同期シグナル安全な関数の一覧を確かめる
        run: |
          curl -sS -L "https://pubs.opengroup.org/onlinepubs/9799919799/functions/V2_chap02.html" -o posix.html || echo "取得できない"
          if [ -f posix.html ]; then
            python3 - <<'PY'
          import re, html, pathlib
          text = pathlib.Path("posix.html").read_text(errors="replace")
          body = html.unescape(re.sub(r"<[^>]+>", " ", text))
          print("pthread_mutex を含むか:", "pthread_mutex" in body)
          for name in ["pthread_mutex_lock", "pthread_mutex_unlock", "pthread_mutex_trylock"]:
              print(f"  {name}:", name in body)
          for name in ["write(", "_Exit(", "sigaction("]:
              print(f"  対照 {name}:", name in body)
          m = re.search(r"not async-signal-safe[^.]{0,400}\.", body)
          print("非安全な関数を呼んだ場合:", (m.group(0)[:300] if m else "該当文なし"))
          PY
          fi

      - name: Build
        run: |
          swift build --build-tests 2>&1 | tee build.log || true
          sed 's#.*/tui-swift/##' build.log > tidy.log
          sites() { grep -o "^\(Sources\|Tests\)/[^:]*:[0-9]*:[0-9]*: error" tidy.log | sort -u; }
          echo "===== エラーの箇所 ====="
          sites | head -40
          echo "===== 合計 ====="
          echo "重複除去した箇所: $(sites | wc -l)"
          echo "error 行: $(grep -c 'error:' tidy.log || true)"
          echo "warning 行: $(grep -c 'warning:' tidy.log || true)"
      - name: Test
        env:
          SWIFT_BACKTRACE: enable=no
        run: |
          swift test 2>&1 | tee test.log || true
          echo "===== 落ちたテスト ====="
          grep -o "Test Case '[^']*' failed" test.log | sort -u
          echo "===== 集計 ====="
          grep -E "^Executed [0-9]+ tests" test.log | tail -1

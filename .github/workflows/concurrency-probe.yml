name: Concurrency Probe

on:
  push:
    branches: ["claude/issue-106-**"]

jobs:
  measure:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: POSIX の一覧を確かめる
        run: |
          echo "## U7 / H2: 非同期シグナル安全な関数の一覧" > summary.txt
          if curl -sS -L "https://pubs.opengroup.org/onlinepubs/9799919799/functions/V2_chap02.html" -o posix.html; then
            python3 .github/scripts/check-posix-list.py >> summary.txt 2>&1
          else
            echo "  取得できない" >> summary.txt
          fi

      - name: Build
        run: |
          swift build --build-tests 2>&1 | tee build.log || true
          sed 's#.*/tui-swift/##' build.log > tidy.log
          echo "## U14 / H10 の G8: strict concurrency" >> summary.txt
          echo "  error 行: $(grep -c 'error:' tidy.log || true)" >> summary.txt
          echo "  warning 行: $(grep -c 'warning:' tidy.log || true)" >> summary.txt
          echo "  エラーの箇所:" >> summary.txt
          grep -o "^\(Sources\|Tests\)/[^:]*:[0-9]*:[0-9]*: error" tidy.log | sort -u | sed 's/^/    /' >> summary.txt
          echo "  エラーの内訳:" >> summary.txt
          grep -o "error: .*" tidy.log | sed 's/[0-9]\{1,\}/N/g' | sort -u | head -8 | sed 's/^/    /' >> summary.txt
          echo "  警告のファイル別（重複除去した箇所）:" >> summary.txt
          grep -o "^\(Sources\|Tests\)/[^:]*:[0-9]*:[0-9]*: warning" tidy.log | sort -u \
            | cut -d: -f1 | sort | uniq -c | sort -rn | sed 's/^/    /' >> summary.txt
          echo "  警告の内訳（上位）:" >> summary.txt
          grep -o "warning: .*" tidy.log | sed 's/[0-9]\{1,\}/N/g' | sort | uniq -c | sort -rn \
            | head -8 | sed 's/^/    /' >> summary.txt

      - name: Test
        env:
          SWIFT_BACKTRACE: enable=no
        run: |
          swift test 2>&1 | tee test.log || true
          echo "## テスト" >> summary.txt
          grep -E "^Executed [0-9]+ tests" test.log | tail -1 | sed 's/^/  /' >> summary.txt
          echo "  落ちたテスト:" >> summary.txt
          grep -o "Test Case '[^']*' failed" test.log | sort -u | sed 's/^/    /' >> summary.txt

      - name: まとめ
        if: always()
        run: cat summary.txt

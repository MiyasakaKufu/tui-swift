# `-strict-concurrency=complete` を恒久的に立てられるかを測る。使い捨て。
#
# 見るのは 2 つ。`.unsafeFlags` を使わない書き方（`.enableExperimentalFeature`）で
# 同じ診断が出るか。その書き方をしたパッケージを、別のパッケージが依存として取り込めるか。
# 取り込みの検査は source-control の依存でしか働かないので、ローカルの git から取る。
name: Strict Concurrency Probe

on:
  push:
    branches: ["claude/issue-106-**"]

jobs:
  measure:
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4

      - name: 測る
        run: |
          # 既定の shell は sh -e なので、失敗した時点で残りの計測ごと止まる。
          set +e
          git config --global --add safe.directory "$PWD"
          git config --global user.email probe@example.com
          git config --global user.name probe
          cp Package.swift Package.swift.orig
          echo "## 旗の書き方" > summary.txt

          apply_setting() {
            local setting="$1"
            cp Package.swift.orig Package.swift
            [ -z "$setting" ] && return 0
            awk -v s="$setting" '
              /^        \.target\(name: "TUIKit", dependencies: \["CTUIShim"\]\),$/ {
                print "        .target("
                print "            name: \"TUIKit\","
                print "            dependencies: [\"CTUIShim\"],"
                printf "            swiftSettings: [%s]\n", s
                print "        ),"
                next
              }
              { print }
            ' Package.swift.orig > Package.swift
            [ "$(grep -c 'swiftSettings' Package.swift)" -eq 1 ]
          }

          probe() {
            local label="$1" setting="$2" status
            echo "### $label" >> summary.txt
            if ! apply_setting "$setting"; then
              echo "  旗を差し込めなかった" >> summary.txt
              return
            fi

            rm -rf .build
            swift build --target TUIKit > probe.log 2>&1
            status=$?
            echo "  自分をビルド: 終了値 $status / error $(grep -c 'error:' probe.log || true) / warning $(grep -c 'warning:' probe.log || true)" >> summary.txt
            grep -o 'error: .*' probe.log | sort -u | head -3 | cut -c1-150 | sed 's/^/    /' >> summary.txt

            # 別のパッケージから、git 越しの依存として取り込む。
            rm -rf /tmp/src /tmp/consumer
            mkdir -p /tmp/src
            tar -c --exclude=.build --exclude=.git . | tar -x -C /tmp/src
            (cd /tmp/src && git init -q -b probe && git add -A && git commit -qm probe)
            mkdir -p /tmp/consumer/Sources/Consumer
            echo 'import TUIKit' > /tmp/consumer/Sources/Consumer/main.swift
            echo 'print(Size(width: 1, height: 1))' >> /tmp/consumer/Sources/Consumer/main.swift
            cat > /tmp/consumer/Package.swift <<'EOF'
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "consumer",
              platforms: [.macOS(.v13)],
              dependencies: [.package(url: "file:///tmp/src", branch: "probe")],
              targets: [
                  .executableTarget(
                      name: "Consumer",
                      dependencies: [.product(name: "TUIKit", package: "src")]
                  )
              ]
          )
          EOF
            (cd /tmp/consumer && swift build > consumer.log 2>&1; \
              echo "  依存として取り込む: 終了値 $?" >> "$GITHUB_WORKSPACE/summary.txt"; \
              grep -o 'error: .*' consumer.log | sort -u | head -3 | cut -c1-170 | sed 's/^/    /' >> "$GITHUB_WORKSPACE/summary.txt")
          }

          probe "旗なし（現状）" ""
          probe "unsafeFlags" '.unsafeFlags(["-strict-concurrency=complete"])'
          probe "enableExperimentalFeature" '.enableExperimentalFeature("StrictConcurrency")'

          cp Package.swift.orig Package.swift

      - name: まとめ
        if: always()
        run: cat summary.txt

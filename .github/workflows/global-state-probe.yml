# 並行性検査が指す箇所を数える。issue を書くための一覧取り。使い捨て。
name: Global State Probe

on:
  push:
    branches: ["claude/issue-106-**"]

jobs:
  measure:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: 検査を掛けて一覧を出す
        run: |
          set +e
          swift build --build-tests -Xswiftc -strict-concurrency=complete > probe.log 2>&1
          echo "## 完全な検査での指摘" > summary.txt
          echo "  終了値: $?" >> summary.txt
          sed 's#.*/tui-swift/##' probe.log > tidy.log
          echo "  箇所（重複除去）:" >> summary.txt
          grep -o '^\(Sources\|Tests\)/[^:]*:[0-9]*:[0-9]*: \(warning\|error\): .*' tidy.log \
            | sort -u | cut -c1-165 | sed 's/^/    /' >> summary.txt
          echo "  ファイル別:" >> summary.txt
          grep -o '^\(Sources\|Tests\)/[^:]*:[0-9]*:[0-9]*: \(warning\|error\)' tidy.log \
            | sort -u | cut -d: -f1 | sort | uniq -c | sort -rn | sed 's/^/    /' >> summary.txt
      - name: まとめ
        if: always()
        run: cat summary.txt
